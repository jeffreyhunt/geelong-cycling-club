<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geelong Cycling Club | Unplanned Downtime</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-dark d-flex align-items-center min-vh-100">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6 text-center">
                
                <!-- Card Container -->
                <div class="card shadow-sm border-0 p-4 p-sm-5 bg-white rounded-4">
                    
                    <!-- Logo Area (Replace logo.png with your file) -->
                    <div class="mb-4">
                        <img src="assets/img/banner.jpg" alt="GCC Logo" class="img-fluid" style="max-height: 300px;">
                    </div>
                    
                    <!-- Main Message -->
                    <h1 class="display-6 fw-bold text-dark mb-3">We'll Be Back Online Soon!</h1>
                    <p class="text-secondary mb-4 fs-5">Unfortunately, we are experiencing some unplanned downtime on our website. We appreciate your patience and will be back shortly.</p>
                    
                    <hr class="my-4 text-muted opacity-25">
                    
                    <!-- Social Media Links -->
                    <p class="small text-uppercase tracking-wider text-muted mb-3 fw-semibold">Reach Us Using The Below Options</p>
                    <div class="d-flex justify-content-center gap-3">
                        <a href="mailto:info@geelongcycling.com" target="_blank" rel="noopener" class="btn btn-outline-secondary border-0 btn-lg rounded-circle" title="Twitter">
                            <i class="bi bi-envelope-at"></i>
                        </a>
                        <a href="https://twitter.com/geelongcycling" target="_blank" rel="noopener" class="btn btn-outline-secondary border-0 btn-lg rounded-circle" title="Twitter">
                            <i class="bi bi-twitter-x"></i>
                        </a>
                        <a href="https://facebook.com/geelongcycling" target="_blank" rel="noopener" class="btn btn-outline-secondary border-0 btn-lg rounded-circle" title="Facebook">
                            <i class="bi bi-facebook"></i>
                        </a>
                        <a href="https://instagram.com/geelong.cc" target="_blank" rel="noopener" class="btn btn-outline-secondary border-0 btn-lg rounded-circle" title="Instagram">
                            <i class="bi bi-instagram"></i>
                        </a>
                    </div>
                    
                </div> <!-- /card -->
                
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
